<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Baby">
  <link rel="manifest" href="manifest.json">
  <title>Baby Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; background: var(--cream); color: var(--g1); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select { font-family: inherit; }

    :root {
      --cream: #F7F5F2; --white: #FFFFFF;
      --border: rgba(0,0,0,0.07);
      --sh-sm: 0 1px 6px rgba(0,0,0,0.05);
      --sh-md: 0 2px 18px rgba(0,0,0,0.09);
      --r-card: 20px;
      --g1: #1A1A1A; --g2: #6B7280; --g3: #B0BAC7;
      --blue-bg: #BEDAEF; --blue-fg: #1B5078; --blue-bd: #A0C9E4;
      --pink-bg: #F4CDD9; --pink-fg: #78162D; --pink-bd: #E8AEC0;
      --green-bg: #C8EDD8; --green-fg: #1B6640;
      --amber-bg: #FDEAC5; --amber-fg: #7A4A00;
      --red-bg: #FAD5D0; --red-fg: #C42100;
      --nav-h: 72px; --hdr-h: 58px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    /* ── App shell (key layout fix) ── */
    #app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    header {
      flex-shrink: 0;
      height: calc(var(--hdr-h) + var(--safe-t));
      padding-top: var(--safe-t);
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .hdr-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
    .hdr-date { position: absolute; right: 18px; font-size: 13px; color: var(--g3); font-weight: 500; }

    main {
      flex: 1;
      min-height: 0; /* critical: allows flex child to shrink and scroll */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px calc(var(--nav-h) + var(--safe-b) + 24px);
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* ── Cards ── */
    .card { background: var(--white); border-radius: var(--r-card); border: 1px solid var(--border); box-shadow: var(--sh-sm); padding: 18px 20px; margin-bottom: 14px; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--g3); margin-bottom: 7px; }
    .status-val { font-size: 17px; font-weight: 600; line-height: 1.45; color: var(--g1); }
    .status-val.muted { color: var(--g3); font-weight: 400; }
    .tag { display: inline-block; padding: 3px 11px; border-radius: 100px; font-size: 14px; font-weight: 700; }
    .tag.left  { background: var(--blue-bg); color: var(--blue-fg); }
    .tag.right { background: var(--pink-bg); color: var(--pink-fg); }
    .dim { color: var(--g3); font-weight: 400; font-size: 15px; }

    /* ── Feed buttons ── */
    .feed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .feed-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 22px 14px 20px;
      border-radius: 26px; border: 2px solid transparent;
      min-height: 170px; box-shadow: var(--sh-md);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      -webkit-user-select: none; user-select: none;
    }
    .feed-btn:active { transform: scale(0.95); box-shadow: var(--sh-sm); }
    .feed-btn.left-btn  { background: var(--blue-bg); border-color: var(--blue-bd); }
    .feed-btn.right-btn { background: var(--pink-bg); border-color: var(--pink-bd); }
    .feed-btn.active-feed { border-width: 3px; }
    .feed-btn.left-btn.active-feed  { border-color: var(--blue-fg); box-shadow: 0 0 0 4px rgba(27,80,120,0.12); }
    .feed-btn.right-btn.active-feed { border-color: var(--pink-fg); box-shadow: 0 0 0 4px rgba(120,22,45,0.12); }

    .feed-btn-orb { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .left-btn  .feed-btn-orb { background: var(--blue-fg); }
    .right-btn .feed-btn-orb { background: var(--pink-fg); }
    .feed-btn-orb svg { width: 22px; height: 22px; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

    .feed-btn-name { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .left-btn  .feed-btn-name { color: var(--blue-fg); }
    .right-btn .feed-btn-name { color: var(--pink-fg); }

    .feed-btn-since { font-size: 11px; color: var(--g2); text-align: center; line-height: 1.4; }

    .feed-timer { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
    .left-btn  .feed-timer { color: var(--blue-fg); }
    .right-btn .feed-timer { color: var(--pink-fg); }

    .feed-stop-hint { font-size: 10px; color: var(--g2); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .pulse-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; vertical-align: middle; animation: pulse-dot 1.2s ease infinite; }
    .pulse-dot.left-dot  { background: var(--blue-fg); }
    .pulse-dot.right-dot { background: var(--pink-fg); }

    /* ── Stats grid ── */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .stat-card { background: var(--white); border-radius: var(--r-card); border: 1px solid var(--border); box-shadow: var(--sh-sm); padding: 16px; }
    .stat-num { font-size: 26px; font-weight: 800; color: var(--g1); line-height: 1; margin-bottom: 4px; }
    .stat-lbl { font-size: 12px; color: var(--g2); }

    /* ── Temp ── */
    .temp-big { font-size: 38px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
    .temp-big.normal { color: var(--green-fg); }
    .temp-big.high   { color: var(--amber-fg); }
    .temp-big.fever  { color: var(--red-fg);   }
    .temp-meta { font-size: 14px; color: var(--g2); margin-top: 5px; }
    .card.temp-normal { border-left: 3px solid var(--green-fg); }
    .card.temp-high   { border-left: 3px solid var(--amber-fg); }
    .card.temp-fever  { border-left: 3px solid var(--red-fg); background: var(--red-bg); }

    .temp-input-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    #temp-input {
      flex: 1; padding: 16px 14px; font-size: 32px; font-weight: 700; letter-spacing: -0.5px;
      text-align: center; background: var(--cream); border: 2px solid var(--border);
      border-radius: 14px; color: var(--g1); outline: none;
      -webkit-appearance: none; appearance: none; -moz-appearance: textfield;
      transition: border-color 0.15s;
    }
    #temp-input:focus { border-color: var(--g1); }
    #temp-input::-webkit-inner-spin-button, #temp-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .temp-unit { font-size: 26px; font-weight: 600; color: var(--g2); flex-shrink: 0; }

    .btn-primary { display: block; width: 100%; padding: 16px; background: var(--g1); color: var(--white); border-radius: 14px; font-size: 16px; font-weight: 700; text-align: center; transition: transform 0.1s, opacity 0.1s; }
    .btn-primary:active { transform: scale(0.98); opacity: 0.82; }

    .ref-list { border-radius: var(--r-card); border: 1px solid var(--border); overflow: hidden; box-shadow: var(--sh-sm); margin-bottom: 14px; }
    .ref-row { display: flex; align-items: center; gap: 12px; padding: 13px 18px; background: var(--white); border-bottom: 1px solid var(--border); }
    .ref-row:last-child { border-bottom: none; }
    .ref-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .ref-row.r-normal .ref-dot { background: var(--green-fg); }
    .ref-row.r-high   .ref-dot { background: var(--amber-fg); }
    .ref-row.r-fever  .ref-dot { background: var(--red-fg);   }
    .ref-range { font-size: 13px; color: var(--g2); min-width: 115px; }
    .ref-lbl { font-size: 14px; font-weight: 600; }
    .ref-row.r-normal .ref-lbl { color: var(--green-fg); }
    .ref-row.r-high   .ref-lbl { color: var(--amber-fg); }
    .ref-row.r-fever  .ref-lbl { color: var(--red-fg);   }

    /* ── Graphs ── */
    .chart-card { background: var(--white); border-radius: var(--r-card); border: 1px solid var(--border); box-shadow: var(--sh-sm); padding: 18px 16px 14px; margin-bottom: 14px; }
    .chart-title { font-size: 14px; font-weight: 700; color: var(--g1); margin-bottom: 14px; }
    .chart-svg { width: 100%; display: block; }
    .chart-empty { font-size: 14px; color: var(--g3); text-align: center; padding: 28px 0; }

    /* ── History ── */
    .filter-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .filter-btn { flex: 1; padding: 10px 6px; border: 1px solid var(--border); border-radius: 12px; background: var(--white); color: var(--g2); font-size: 13px; font-weight: 600; transition: background 0.15s, color 0.15s, border-color 0.15s; box-shadow: var(--sh-sm); }
    .filter-btn.active { background: var(--g1); color: var(--white); border-color: var(--g1); }
    .day-header { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--g3); padding: 14px 4px 8px; }
    .day-header:first-child { padding-top: 0; }

    .hist-entry { display: flex; align-items: center; gap: 13px; background: var(--white); border-radius: 16px; border: 1px solid var(--border); padding: 13px 14px; margin-bottom: 8px; box-shadow: var(--sh-sm); }
    .entry-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex-shrink: 0; }
    .entry-icon.left   { background: var(--blue-bg);  color: var(--blue-fg);  }
    .entry-icon.right  { background: var(--pink-bg);  color: var(--pink-fg);  }
    .entry-icon.normal { background: var(--green-bg); color: var(--green-fg); }
    .entry-icon.high   { background: var(--amber-bg); color: var(--amber-fg); }
    .entry-icon.fever  { background: var(--red-bg);   color: var(--red-fg);   }
    .entry-body { flex: 1; min-width: 0; }
    .entry-title { font-size: 15px; font-weight: 600; color: var(--g1); margin-bottom: 2px; }
    .entry-title.high  { color: var(--amber-fg); }
    .entry-title.fever { color: var(--red-fg);   }
    .entry-sub { font-size: 13px; color: var(--g2); }
    .entry-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--g3); transition: background 0.15s, color 0.15s; }
    .icon-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .edit-btn:active { background: rgba(27,80,120,0.1); color: var(--blue-fg); }
    .del-btn:active  { background: var(--red-bg); color: var(--red-fg); }

    .empty-state { text-align: center; padding: 64px 20px; color: var(--g3); }
    .empty-icon { font-size: 44px; margin-bottom: 12px; }
    .empty-text { font-size: 15px; }

    /* ── Bottom nav ── */
    #bottom-nav {
      flex-shrink: 0;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: rgba(255,255,255,0.92);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex; box-shadow: 0 -1px 10px rgba(0,0,0,0.05);
    }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 0; color: var(--g3); transition: color 0.15s; }
    .nav-btn.active { color: var(--g1); }
    .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .nav-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.2px; }

    /* ── Edit modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal-sheet { background: var(--cream); border-radius: 24px 24px 0 0; width: 100%; max-height: 90dvh; max-height: 90vh; overflow-y: auto; padding-bottom: calc(20px + var(--safe-b)); }
    .modal-handle { width: 36px; height: 4px; background: var(--g3); border-radius: 2px; margin: 14px auto 6px; opacity: 0.4; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 14px; }
    .modal-title { font-size: 17px; font-weight: 700; }
    .modal-cancel { font-size: 16px; color: var(--g2); font-weight: 500; padding: 4px 0; }
    .modal-body { padding: 0 16px 8px; }
    .form-group { margin-bottom: 16px; }
    .form-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.7px; text-transform: uppercase; color: var(--g3); margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 14px 16px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 14px; font-size: 16px; color: var(--g1);
      outline: none; -webkit-appearance: none; appearance: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--g1); }
    .form-input::-webkit-inner-spin-button, .form-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-hint { font-size: 11px; color: var(--g3); text-align: center; margin-top: 5px; }
    .side-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .side-opt { padding: 14px; border-radius: 14px; border: 2px solid var(--border); font-size: 15px; font-weight: 700; text-align: center; background: var(--white); color: var(--g2); transition: all 0.12s; }
    .side-opt.sel-left  { background: var(--blue-bg); color: var(--blue-fg); border-color: var(--blue-fg); }
    .side-opt.sel-right { background: var(--pink-bg); color: var(--pink-fg); border-color: var(--pink-fg); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
      left: 50%; transform: translateX(-50%) translateY(14px);
      background: rgba(26,26,26,0.92);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      color: white; padding: 11px 22px; border-radius: 100px;
      font-size: 14px; font-weight: 600; white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">

  <header>
    <h1 class="hdr-title">Baby Tracker</h1>
    <span class="hdr-date" id="hdr-date"></span>
  </header>

  <main id="main">

    <!-- FEED TAB -->
    <section id="tab-feed" class="tab-pane active">
      <div class="card" id="last-feed-card">
        <div class="lbl">Last Feed</div>
        <div class="status-val muted" id="last-feed-val">No feeds logged yet</div>
      </div>

      <div class="feed-grid">
        <button class="feed-btn left-btn" id="btn-left" onclick="toggleFeed('left')">
          <div class="feed-btn-orb">
            <svg viewBox="0 0 24 24"><path d="M19 12H5m0 0 7-7m-7 7 7 7"/></svg>
          </div>
          <span class="feed-btn-name">Left</span>
          <span class="feed-btn-since" id="left-since">—</span>
        </button>
        <button class="feed-btn right-btn" id="btn-right" onclick="toggleFeed('right')">
          <div class="feed-btn-orb">
            <svg viewBox="0 0 24 24"><path d="M5 12h14m0 0-7-7m7 7-7 7"/></svg>
          </div>
          <span class="feed-btn-name">Right</span>
          <span class="feed-btn-since" id="right-since">—</span>
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num" id="today-count">0</div>
          <div class="stat-lbl">feeds today</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="hour-total">—</div>
          <div class="stat-lbl">min fed this hour</div>
        </div>
      </div>
    </section>

    <!-- TEMP TAB -->
    <section id="tab-temp" class="tab-pane">
      <div class="card" id="last-temp-card">
        <div class="lbl">Last Reading</div>
        <div id="last-temp-inner"><div class="status-val muted">No readings yet</div></div>
      </div>
      <div class="card">
        <div class="temp-input-wrap">
          <input type="number" id="temp-input" inputmode="decimal" step="0.1" min="35.0" max="43.0" value="37.0">
          <span class="temp-unit">°C</span>
        </div>
        <button class="btn-primary" onclick="logTemp()">Log Temperature</button>
      </div>
      <div class="ref-list">
        <div class="ref-row r-normal"><div class="ref-dot"></div><div class="ref-range">36.5 – 37.5 °C</div><div class="ref-lbl">Normal</div></div>
        <div class="ref-row r-high"><div class="ref-dot"></div><div class="ref-range">37.5 – 38.0 °C</div><div class="ref-lbl">Slightly elevated</div></div>
        <div class="ref-row r-fever"><div class="ref-dot"></div><div class="ref-range">≥ 38.0 °C</div><div class="ref-lbl">Fever — call your doctor</div></div>
      </div>
    </section>

    <!-- GRAPHS TAB -->
    <section id="tab-graphs" class="tab-pane">
      <div class="chart-card">
        <div class="chart-title">Daily feeding time (min)</div>
        <div id="feed-chart"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Temperature readings</div>
        <div id="temp-chart"></div>
      </div>
    </section>

    <!-- HISTORY TAB -->
    <section id="tab-history" class="tab-pane">
      <div class="filter-row">
        <button class="filter-btn active" data-f="all"  onclick="setFilter('all')">All</button>
        <button class="filter-btn"        data-f="feed" onclick="setFilter('feed')">Feeds</button>
        <button class="filter-btn"        data-f="temp" onclick="setFilter('temp')">Temperatures</button>
      </div>
      <div id="hist-list"></div>
    </section>

  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-t="feed" onclick="goTab('feed')">
      <svg viewBox="0 0 24 24"><path d="M12 2C8 7 5 10.5 5 14a7 7 0 0014 0c0-3.5-3-7-7-12z"/></svg>
      <span class="nav-lbl">Feed</span>
    </button>
    <button class="nav-btn" data-t="temp" onclick="goTab('temp')">
      <svg viewBox="0 0 24 24"><path d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z"/></svg>
      <span class="nav-lbl">Temp</span>
    </button>
    <button class="nav-btn" data-t="graphs" onclick="goTab('graphs')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      <span class="nav-lbl">Graphs</span>
    </button>
    <button class="nav-btn" data-t="history" onclick="goTab('history')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="nav-lbl">History</span>
    </button>
  </nav>

</div>

<!-- Edit modal -->
<div id="edit-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Edit Entry</span>
      <button class="modal-cancel" onclick="closeEdit()">Cancel</button>
    </div>
    <div class="modal-body" id="edit-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const KEY = 'baby-tracker-v1';
let entries    = [];
let tab        = 'feed';
let filter     = 'all';
let activeFeed = null; // { side, startTs, timerId }
let editId     = null;

function load() {
  try { entries = JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch { entries = []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(entries)); }

/* ── Helpers ── */
function ago(ts) {
  const d = Date.now() - ts;
  const s = Math.floor(d / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), dy = Math.floor(h / 24);
  if (s < 60)  return 'just now';
  if (m < 60)  return m + 'm ago';
  if (h < 24)  return m % 60 ? h + 'h ' + (m % 60) + 'm ago' : h + 'h ago';
  return dy + 'd ago';
}
function fmtT(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function fmtD(ts) {
  const d = new Date(ts), t = new Date(), y = new Date();
  y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return 'Today';
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
}
function cat(v) { return v >= 38 ? 'fever' : v >= 37.5 ? 'high' : 'normal'; }
function catLbl(v) { return { normal: 'Normal', high: 'Slightly elevated', fever: 'Fever' }[cat(v)]; }
function fmtDur(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), r = s % 60;
  return r ? m + 'm ' + r + 's' : m + 'm';
}
function liveTimer(startTs) {
  const s = Math.floor((Date.now() - startTs) / 1000);
  const m = Math.floor(s / 60), r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}
function toDateTimeLocal(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ── Feed actions ── */
function toggleFeed(side) {
  if (activeFeed) {
    if (activeFeed.side === side) {
      // Stop this side
      clearInterval(activeFeed.timerId);
      const duration = Math.round((Date.now() - activeFeed.startTs) / 1000);
      entries.unshift({ id: String(activeFeed.startTs), type: 'feed', side, ts: activeFeed.startTs, duration });
      const dur = duration;
      activeFeed = null;
      save();
      renderFeed();
      toast((side === 'left' ? '← Left' : 'Right →') + ' · ' + fmtDur(dur));
    } else {
      // Other side active: save it, start new
      clearInterval(activeFeed.timerId);
      const dur = Math.round((Date.now() - activeFeed.startTs) / 1000);
      entries.unshift({ id: String(activeFeed.startTs), type: 'feed', side: activeFeed.side, ts: activeFeed.startTs, duration: dur });
      save();
      activeFeed = null;
      startFeedTimer(side);
    }
  } else {
    startFeedTimer(side);
  }
}

function startFeedTimer(side) {
  const startTs = Date.now();
  const timerId = setInterval(function() {
    const btn = document.getElementById(side === 'left' ? 'btn-left' : 'btn-right');
    const el = btn && btn.querySelector('.feed-timer');
    if (el) el.textContent = liveTimer(startTs);
  }, 1000);
  activeFeed = { side, startTs, timerId };
  renderFeed();
}

function logTemp() {
  const v = parseFloat(document.getElementById('temp-input').value);
  if (isNaN(v) || v < 35 || v > 43) { toast('Enter a temperature between 35 and 43 °C'); return; }
  entries.unshift({ id: String(Date.now()), type: 'temp', value: v, ts: Date.now() });
  save();
  renderTemp();
  toast(v.toFixed(1) + ' °C logged');
}

function del(id) {
  if (!confirm('Remove this entry?')) return;
  entries = entries.filter(e => e.id !== id);
  save();
  renderFeed();
  renderTemp();
  if (tab === 'history') renderHistory();
  if (tab === 'graphs')  renderGraphs();
}

/* ── Edit ── */
function openEdit(id) {
  editId = id;
  const e = entries.find(x => x.id === id);
  if (!e) return;
  let body = '';

  if (e.type === 'feed') {
    const durM = e.duration ? Math.floor(e.duration / 60) : 0;
    const durS = e.duration ? e.duration % 60 : 0;
    body = `
      <div class="form-group">
        <div class="form-lbl">Side</div>
        <div class="side-toggle">
          <button class="side-opt ${e.side === 'left' ? 'sel-left' : ''}" id="edit-left" onclick="editSide('left')">← Left</button>
          <button class="side-opt ${e.side === 'right' ? 'sel-right' : ''}" id="edit-right" onclick="editSide('right')">Right →</button>
        </div>
      </div>
      <div class="form-group">
        <div class="form-lbl">Start time</div>
        <input type="datetime-local" id="edit-ts" class="form-input" value="${toDateTimeLocal(e.ts)}">
      </div>
      <div class="form-group">
        <div class="form-lbl">Duration</div>
        <div class="form-row">
          <div>
            <input type="number" id="edit-dur-m" class="form-input" min="0" max="120" value="${durM}">
            <div class="form-hint">minutes</div>
          </div>
          <div>
            <input type="number" id="edit-dur-s" class="form-input" min="0" max="59" value="${durS}">
            <div class="form-hint">seconds</div>
          </div>
        </div>
      </div>
      <button class="btn-primary" onclick="saveEdit()">Save changes</button>`;
  } else {
    body = `
      <div class="form-group">
        <div class="form-lbl">Temperature (°C)</div>
        <input type="number" id="edit-temp" class="form-input" inputmode="decimal" step="0.1" min="35" max="43" value="${e.value.toFixed(1)}">
      </div>
      <div class="form-group">
        <div class="form-lbl">Time</div>
        <input type="datetime-local" id="edit-ts" class="form-input" value="${toDateTimeLocal(e.ts)}">
      </div>
      <button class="btn-primary" onclick="saveEdit()">Save changes</button>`;
  }

  document.getElementById('edit-body').innerHTML = body;
  document.getElementById('edit-modal').classList.remove('hidden');
}

function editSide(side) {
  document.getElementById('edit-left').className  = 'side-opt' + (side === 'left'  ? ' sel-left'  : '');
  document.getElementById('edit-right').className = 'side-opt' + (side === 'right' ? ' sel-right' : '');
}

function closeEdit() {
  editId = null;
  document.getElementById('edit-modal').classList.add('hidden');
}

function saveEdit() {
  const e = entries.find(x => x.id === editId);
  if (!e) return;
  const tsInput = document.getElementById('edit-ts');
  const newTs = tsInput ? new Date(tsInput.value).getTime() : e.ts;
  if (isNaN(newTs)) { toast('Invalid date/time'); return; }

  if (e.type === 'feed') {
    const leftBtn = document.getElementById('edit-left');
    e.side     = (leftBtn && leftBtn.classList.contains('sel-left')) ? 'left' : 'right';
    e.ts       = newTs;
    e.duration = (parseInt(document.getElementById('edit-dur-m').value) || 0) * 60
               + (parseInt(document.getElementById('edit-dur-s').value) || 0);
  } else {
    const v = parseFloat(document.getElementById('edit-temp').value);
    if (isNaN(v) || v < 35 || v > 43) { toast('Invalid temperature'); return; }
    e.value = v;
    e.ts    = newTs;
  }

  // Re-sort by ts descending
  entries.sort((a, b) => b.ts - a.ts);
  save();
  closeEdit();
  renderFeed();
  renderTemp();
  if (tab === 'history') renderHistory();
  if (tab === 'graphs')  renderGraphs();
  toast('Entry updated');
}

/* ── Render: Feed tab ── */
function renderFeed() {
  const feeds  = entries.filter(e => e.type === 'feed');
  const lefts  = feeds.filter(e => e.side === 'left');
  const rights = feeds.filter(e => e.side === 'right');

  const el = document.getElementById('last-feed-val');
  if (activeFeed) {
    el.className = 'status-val';
    const cls = activeFeed.side === 'left' ? 'left-dot' : 'right-dot';
    el.innerHTML = '<span class="pulse-dot ' + cls + '"></span>&ensp;Feeding <span class="tag ' + activeFeed.side + '">' + (activeFeed.side === 'left' ? 'Left' : 'Right') + '</span>&ensp;in progress';
  } else if (!feeds.length) {
    el.className = 'status-val muted';
    el.textContent = 'No feeds logged yet';
  } else {
    const f = feeds[0];
    el.className = 'status-val';
    el.innerHTML = '<span class="tag ' + f.side + '">' + (f.side === 'left' ? 'Left' : 'Right') + '</span>&ensp;' + ago(f.ts) + ' <span class="dim">at ' + fmtT(f.ts) + '</span>' + (f.duration ? '&ensp;<span class="dim">· ' + fmtDur(f.duration) + '</span>' : '');
  }

  renderFeedBtn('left',  lefts,  activeFeed && activeFeed.side === 'left');
  renderFeedBtn('right', rights, activeFeed && activeFeed.side === 'right');

  const today = new Date().toDateString();
  document.getElementById('today-count').textContent = feeds.filter(e => new Date(e.ts).toDateString() === today).length;

  const cutoff = Date.now() - 3600000;
  const hourSecs = feeds.filter(e => e.ts >= cutoff && e.duration).reduce((s, e) => s + e.duration, 0);
  document.getElementById('hour-total').textContent = hourSecs > 0 ? Math.round(hourSecs / 60) : '—';
}

function renderFeedBtn(side, history, isActive) {
  const btn     = document.getElementById(side === 'left' ? 'btn-left' : 'btn-right');
  const sinceEl = btn.querySelector('.feed-btn-since');
  let timerEl   = btn.querySelector('.feed-timer');
  let hintEl    = btn.querySelector('.feed-stop-hint');

  if (isActive) {
    btn.classList.add('active-feed');
    if (!timerEl) {
      timerEl = document.createElement('span');
      timerEl.className = 'feed-timer';
      btn.insertBefore(timerEl, sinceEl);
    }
    if (!hintEl) {
      hintEl = document.createElement('span');
      hintEl.className = 'feed-stop-hint';
      hintEl.textContent = 'Tap to stop';
      btn.insertBefore(hintEl, sinceEl);
    }
    timerEl.textContent = liveTimer(activeFeed.startTs);
    sinceEl.style.display = 'none';
  } else {
    btn.classList.remove('active-feed');
    if (timerEl) timerEl.remove();
    if (hintEl)  hintEl.remove();
    sinceEl.style.display = '';
    sinceEl.textContent = history.length ? ago(history[0].ts) : 'Not used yet';
  }
}

/* ── Render: Temp tab ── */
function renderTemp() {
  const temps = entries.filter(e => e.type === 'temp');
  const card  = document.getElementById('last-temp-card');
  const inner = document.getElementById('last-temp-inner');
  if (!temps.length) {
    card.className = 'card';
    inner.innerHTML = '<div class="status-val muted">No readings yet</div>';
    return;
  }
  const t = temps[0], c = cat(t.value);
  card.className = 'card temp-' + c;
  inner.innerHTML = '<div class="temp-big ' + c + '">' + t.value.toFixed(1) + '°C</div><div class="temp-meta">' + catLbl(t.value) + ' &middot; ' + ago(t.ts) + ' at ' + fmtT(t.ts) + '</div>';
}

/* ── Render: Graphs ── */
function renderGraphs() {
  renderFeedChart();
  renderTempChart();
}

function renderFeedChart() {
  const container = document.getElementById('feed-chart');
  const feeds = entries.filter(e => e.type === 'feed' && e.duration);

  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - i);
    var next = new Date(d.getTime());
    next.setDate(next.getDate() + 1);
    var dayFeeds = feeds.filter(e => e.ts >= d.getTime() && e.ts < next.getTime());
    var totalMins = Math.round(dayFeeds.reduce((s, e) => s + e.duration, 0) / 60);
    var labels = ['Su','Mo','Tu','We','Th','Fr','Sa'];
    days.push({ label: labels[d.getDay()], totalMins: totalMins, isToday: i === 0 });
  }

  if (!days.some(d => d.totalMins > 0)) {
    container.innerHTML = '<div class="chart-empty">Log some feeds with timing to see the chart</div>';
    return;
  }

  var W = 300, H = 190;
  var ml = 30, mr = 8, mt = 20, mb = 28;
  var cw = W - ml - mr, ch = H - mt - mb;
  var barW = cw / 7;
  var barPad = barW * 0.18;
  var maxMins = Math.max.apply(null, days.map(d => d.totalMins));
  maxMins = Math.max(maxMins, 5);

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-svg">';

  // Gridlines
  var gridVals = [0, Math.round(maxMins / 2), maxMins];
  gridVals.forEach(function(gv) {
    var y = mt + ch - (gv / maxMins) * ch;
    svg += '<line x1="' + ml + '" y1="' + y.toFixed(1) + '" x2="' + (W - mr) + '" y2="' + y.toFixed(1) + '" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>';
    svg += '<text x="' + (ml - 4) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="9" fill="#B0BAC7">' + gv + '</text>';
  });

  days.forEach(function(d, i) {
    var x  = ml + i * barW + barPad;
    var bw = barW - barPad * 2;
    var bh = d.totalMins > 0 ? Math.max((d.totalMins / maxMins) * ch, 3) : 0;
    var y  = mt + ch - bh;
    var fill = d.isToday ? '#1A1A1A' : '#D1D5DB';
    if (bh > 0) svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="4" fill="' + fill + '"/>';
    if (d.totalMins > 0) svg += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle" font-size="9" fill="' + fill + '" font-weight="600">' + d.totalMins + '</text>';
    var cx = (ml + i * barW + barW / 2).toFixed(1);
    svg += '<text x="' + cx + '" y="' + (H - 7) + '" text-anchor="middle" font-size="10" fill="' + (d.isToday ? '#1A1A1A' : '#B0BAC7') + '" font-weight="' + (d.isToday ? '700' : '400') + '">' + d.label + '</text>';
  });

  svg += '</svg>';
  container.innerHTML = svg;
}

function renderTempChart() {
  var container = document.getElementById('temp-chart');
  var temps = entries.filter(e => e.type === 'temp').slice(0, 20).reverse();

  if (!temps.length) {
    container.innerHTML = '<div class="chart-empty">Log some temperatures to see the chart</div>';
    return;
  }

  var W = 300, H = 190;
  var ml = 36, mr = 10, mt = 20, mb = 32;
  var cw = W - ml - mr, ch = H - mt - mb;
  var minT = 36.0, maxT = 40.0, rangeT = maxT - minT;

  function ty(val) { return mt + ch - ((val - minT) / rangeT) * ch; }
  function tx(i) { return temps.length === 1 ? ml + cw / 2 : ml + (i / (temps.length - 1)) * cw; }

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-svg">';

  // Reference lines
  var refs = [
    { val: 38.0, color: '#C42100', label: '38°' },
    { val: 37.5, color: '#7A4A00', label: '37.5°' },
    { val: 36.5, color: '#1B6640', label: '36.5°' }
  ];
  refs.forEach(function(r) {
    var y = ty(r.val);
    svg += '<line x1="' + ml + '" y1="' + y.toFixed(1) + '" x2="' + (W - mr) + '" y2="' + y.toFixed(1) + '" stroke="' + r.color + '" stroke-width="1" stroke-dasharray="3 3" opacity="0.35"/>';
    svg += '<text x="' + (ml - 3) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="8" fill="' + r.color + '" opacity="0.7">' + r.label + '</text>';
  });

  // Y axis extremes
  svg += '<text x="' + (ml - 3) + '" y="' + (ty(40) + 3).toFixed(1) + '" text-anchor="end" font-size="8" fill="#B0BAC7">40°</text>';
  svg += '<text x="' + (ml - 3) + '" y="' + (ty(36) + 3).toFixed(1) + '" text-anchor="end" font-size="8" fill="#B0BAC7">36°</text>';

  // Line
  if (temps.length > 1) {
    var pts = temps.map((t, i) => tx(i).toFixed(1) + ',' + ty(t.value).toFixed(1)).join(' ');
    svg += '<polyline points="' + pts + '" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.2"/>';
  }

  // Dots + value labels
  temps.forEach(function(t, i) {
    var x = tx(i), y = ty(t.value);
    var c = cat(t.value);
    var dotColor = c === 'fever' ? '#C42100' : c === 'high' ? '#7A4A00' : '#1B6640';
    svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="' + dotColor + '"/>';
    svg += '<text x="' + x.toFixed(1) + '" y="' + (y - 9).toFixed(1) + '" text-anchor="middle" font-size="9" fill="' + dotColor + '" font-weight="700">' + t.value.toFixed(1) + '</text>';
  });

  // X-axis: first and last label
  if (temps.length >= 1) {
    svg += '<text x="' + tx(0).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="' + (temps.length === 1 ? 'middle' : 'start') + '" font-size="9" fill="#B0BAC7">' + fmtTShort(temps[0].ts) + '</text>';
    if (temps.length > 1) {
      svg += '<text x="' + tx(temps.length - 1).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="end" font-size="9" fill="#B0BAC7">' + fmtTShort(temps[temps.length - 1].ts) + '</text>';
    }
  }

  svg += '</svg>';
  container.innerHTML = svg;
}

function fmtTShort(ts) {
  var d = new Date(ts), today = new Date(), yest = new Date();
  yest.setDate(today.getDate() - 1);
  var t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === today.toDateString()) return t;
  if (d.toDateString() === yest.toDateString())  return 'Yest ' + t;
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
}

/* ── Render: History ── */
function renderHistory() {
  var list = document.getElementById('hist-list');
  var rows = filter === 'feed' ? entries.filter(e => e.type === 'feed')
           : filter === 'temp' ? entries.filter(e => e.type === 'temp')
           : entries;

  if (!rows.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Nothing here yet</div></div>';
    return;
  }

  var EDIT = '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  var DEL  = '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  var html = '', lastD = '';
  rows.slice(0, 120).forEach(function(e) {
    var d = fmtD(e.ts);
    if (d !== lastD) { html += '<div class="day-header">' + d + '</div>'; lastD = d; }

    if (e.type === 'feed') {
      var s = e.side;
      html += '<div class="hist-entry">'
        + '<div class="entry-icon ' + s + '">' + (s === 'left' ? '←' : '→') + '</div>'
        + '<div class="entry-body">'
        + '<div class="entry-title">Feed · ' + (s === 'left' ? 'Left Side' : 'Right Side') + (e.duration ? ' · ' + fmtDur(e.duration) : '') + '</div>'
        + '<div class="entry-sub">' + fmtT(e.ts) + ' · ' + ago(e.ts) + '</div>'
        + '</div>'
        + '<div class="entry-actions">'
        + '<button class="icon-btn edit-btn" onclick="openEdit(\'' + e.id + '\')" aria-label="Edit">' + EDIT + '</button>'
        + '<button class="icon-btn del-btn"  onclick="del(\'' + e.id + '\')"      aria-label="Delete">' + DEL + '</button>'
        + '</div></div>';
    } else {
      var c = cat(e.value);
      html += '<div class="hist-entry">'
        + '<div class="entry-icon ' + c + '">°C</div>'
        + '<div class="entry-body">'
        + '<div class="entry-title ' + c + '">' + e.value.toFixed(1) + '°C · ' + catLbl(e.value) + '</div>'
        + '<div class="entry-sub">' + fmtT(e.ts) + ' · ' + ago(e.ts) + '</div>'
        + '</div>'
        + '<div class="entry-actions">'
        + '<button class="icon-btn edit-btn" onclick="openEdit(\'' + e.id + '\')" aria-label="Edit">' + EDIT + '</button>'
        + '<button class="icon-btn del-btn"  onclick="del(\'' + e.id + '\')"      aria-label="Delete">' + DEL + '</button>'
        + '</div></div>';
    }
  });
  list.innerHTML = html;
}

/* ── Navigation ── */
function goTab(t) {
  tab = t;
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
  if (t === 'feed')    renderFeed();
  if (t === 'temp')    renderTemp();
  if (t === 'graphs')  renderGraphs();
  if (t === 'history') renderHistory();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  renderHistory();
}

/* ── Toast ── */
var toastTmr;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(function() { el.classList.remove('show'); }, 2600);
}

/* ── PWA ── */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function() {});

/* ── Init ── */
load();
document.getElementById('hdr-date').textContent =
  new Date().toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
renderFeed();
renderTemp();

// Close modal on backdrop tap
document.getElementById('edit-modal').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});

// Refresh relative times every minute
setInterval(function() {
  if (tab === 'feed')    renderFeed();
  if (tab === 'temp')    renderTemp();
  if (tab === 'history') renderHistory();
}, 60000);
</script>
</body>
</html>
